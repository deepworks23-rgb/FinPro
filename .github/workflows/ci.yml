name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (causa na contribuição se falhar)
        run: npm run lint

      - name: Unit tests (causa na contribuição se falhar)
        run: npm run test

      - name: Architecture & security fences (causa na contribuição se falhar)
        run: npm run fences

      - name: Production build (causa na contribuição se falhar)
        run: npm run build
